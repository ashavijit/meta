name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      # 🧩 Publish to npm
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

      # 🪵 Create a JSON log file
      - name: Create publish log
        run: |
          echo "{" > publish.log.json
          echo "  \"timestamp\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"," >> publish.log.json
          echo "  \"packageName\": \"$(node -p \"require('./package.json').name\")\"," >> publish.log.json
          echo "  \"version\": \"$(node -p \"require('./package.json').version\")\"," >> publish.log.json
          echo "  \"releaseTag\": \"${{ github.event.release.tag_name }}\"," >> publish.log.json
          echo "  \"commitSHA\": \"${{ github.sha }}\"," >> publish.log.json
          echo "  \"publishedBy\": \"${{ github.actor }}\"," >> publish.log.json
          echo "  \"status\": \"success\"" >> publish.log.json
          echo "}" >> publish.log.json

      # 📦 Upload as an artifact (for tracking or debugging)
      - name: Upload publish log
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log.json
